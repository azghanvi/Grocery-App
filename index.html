  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Install prompt styling */
    .install-prompt {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 12px;
      animation: slideUp 0.3s ease-out;
    }

    .install-prompt.show {
      display: flex;
    }

    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    .install-prompt button {
      background: white;
      color: #667eea;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .install-prompt button:hover {
      background: #f0f0f0;
    }
  </style>
</head>

    function App() {
      const [items, setItems] = useState(initialItems);
      const [searchQuery, setSearchQuery] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [modalMode, setModalMode] = useState('add');
      const [currentItem, setCurrentItem] = useState({ id: null, name: '', unit: 'Item', quantity: '', category: 'Other' });
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [collapsedCategories, setCollapsedCategories] = useState({});

      const filteredItems = items.filter(item =>
        item.name.toLowerCase().includes(searchQuery.toLowerCase())
      );

      // Group items by category
      const groupedItems = filteredItems.reduce((acc, item) => {
        const category = item.category || 'Other';
        if (!acc[category]) {
          acc[category] = [];
        }
        acc[category].push(item);
        return acc;
      }, {});

      const toggleCategory = (category) => {
        setCollapsedCategories(prev => ({
          ...prev,
          [category]: !prev[category]
        }));
      };

      const handleCheckbox = (id, e) => {
        e.stopPropagation();
        setItems(items.map(item =>
          item.id === id ? { ...item, checked: !item.checked } : item
        ));
      };

      const handleRowClick = (id) => {
        setItems(items.map(item =>
          item.id === id ? { ...item, checked: !item.checked } : item
        ));
      };

      const handleQuantityChange = (id, delta, e) => {
        e.stopPropagation();
        setItems(items.map(item => {
          if (item.id === id) {
            const newQuantity = Math.max(0, parseFloat(item.quantity) + delta);
            return { ...item, quantity: newQuantity };
          }
          return item;
        }));
      };

      const handleAdd = () => {
        setModalMode('add');
        setCurrentItem({ id: null, name: '', unit: 'Item', quantity: '', category: 'Other' });
        setShowModal(true);
      };

      const handleEdit = () => {
        const checkedItems = items.filter(item => item.checked);
        if (checkedItems.length === 0) {
          alert('Please select an item to edit');
          return;
        }
        if (checkedItems.length > 1) {
          alert('Please select only one item to edit');
          return;
        }
        setModalMode('edit');
        setCurrentItem(checkedItems[0]);
        setShowModal(true);
      };

      const handleDelete = () => {
        const checkedItems = items.filter(item => item.checked);
        if (checkedItems.length === 0) {
          alert('Please select items to delete');
          return;
        }
        setShowDeleteConfirm(true);
      };

      const confirmDelete = () => {
        setItems(items.filter(item => !item.checked));
        setShowDeleteConfirm(false);
      };

      const handleSave = () => {
        if (!currentItem.name.trim() || !currentItem.quantity) {
          alert('Please fill in all fields');
          return;
        }

        if (modalMode === 'add') {
          const newItem = {
            ...currentItem,
            id: Math.max(...items.map(i => i.id), 0) + 1,
            checked: false
          };
          setItems([...items, newItem]);
        } else {
          setItems(items.map(item =>
            item.id === currentItem.id ? currentItem : item
          ));
        }
        setShowModal(false);
      };

      const handleSend = () => {
        const checkedItems = items.filter(item => item.checked);
        if (checkedItems.length === 0) {
          alert('Please select items to send');
          return;
        }

        const message = checkedItems
          .map(item => `${item.name} ${item.quantity} ${item.unit}`)
          .join(', ');
        
        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
      };

                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-10 pr-4 py-3 border-2 border-purple-200 rounded-lg focus:outline-none focus:border-purple-500 transition-colors"
              />
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {Object.entries(groupedItems).map(([category, categoryItems]) => (
              <div key={category} className="bg-white rounded-lg shadow-md overflow-hidden">
                <button
                  onClick={() => toggleCategory(category)}
                  className="w-full flex items-center justify-between p-3 bg-gradient-to-r from-purple-100 to-blue-100 hover:from-purple-200 hover:to-blue-200 transition-colors"
                >
                  <span className="font-bold text-gray-800">{category}</span>
                  <div className="flex items-center gap-2">
                    <span className="text-sm text-gray-600 bg-white px-2 py-1 rounded-full">
                      {categoryItems.length}
                    </span>
                    <ChevronDown 
                      size={20} 
                      className={`transition-transform ${collapsedCategories[category] ? '-rotate-90' : ''}`}
                    />
                  </div>
                </button>
                
                {!collapsedCategories[category] && (
                  <div className="divide-y divide-gray-100">
                    {categoryItems.map(item => (
                      <div
                        key={item.id}
                        onClick={() => handleRowClick(item.id)}
                        className={`p-4 flex items-center gap-3 hover:bg-purple-50 transition-colors cursor-pointer ${
                          item.checked ? 'bg-purple-50' : ''
                        }`}
                      >
                        <input
                          type="checkbox"
                          checked={item.checked}
                          onChange={(e) => handleCheckbox(item.id, e)}
                          className="w-5 h-5 text-purple-600 rounded focus:ring-2 focus:ring-purple-500"
                        />
                        <div className="flex-1 font-medium text-gray-800">{item.name}</div>
                        <div className="text-sm text-gray-600 bg-purple-100 px-3 py-1 rounded-full">
                          {item.unit}
                        </div>
                        <div className="flex items-center gap-1 bg-blue-100 rounded-full">
                          <button
                            onClick={(e) => handleQuantityChange(item.id, -0.5, e)}
                            className="p-1 hover:bg-blue-200 rounded-full transition-colors"
                          >
                            <Minus size={16} />
                          </button>
                          <span className="text-sm font-semibold text-gray-800 px-2 min-w-[40px] text-center">
                            {item.quantity}
                          </span>
                          <button
                            onClick={(e) => handleQuantityChange(item.id, 0.5, e)}
                            className="p-1 hover:bg-blue-200 rounded-full transition-colors"
                          >
                            <Plus size={16} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>

          <div className="bg-white shadow-lg p-4 grid grid-cols-4 gap-2">
            <button
              onClick={handleAdd}
              className="flex flex-col items-center gap-1 p-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors"
            >
              <Plus size={24} />
              <span className="text-xs font-semibold">Add</span>
            </button>
            <button
              onClick={handleEdit}
              className="flex flex-col items-center gap-1 p-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
            >
              <Edit2 size={24} />
              <span className="text-xs font-semibold">Edit</span>
            </button>
            <button
              onClick={handleDelete}
              className="flex flex-col items-center gap-1 p-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
            >
              <Trash2 size={24} />
              <span className="text-xs font-semibold">Del</span>
            </button>
            <button
              onClick={handleSend}
              className="flex flex-col items-center gap-1 p-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors"
            >
              <Send size={24} />
              <span className="text-xs font-semibold">Send</span>
            </button>
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-xl font-bold text-gray-800">
                    {modalMode === 'add' ? 'Add Item' : 'Edit Item'}
                  </h2>
                  <button onClick={() => setShowModal(false)} className="text-gray-500 hover:text-gray-700">
                    <X size={24} />
                  </button>
                </div>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Item Name</label>
                    <input
                      type="text"
                      value={currentItem.name}
                      onChange={(e) => setCurrentItem({ ...currentItem, name: e.target.value })}
                      className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                      placeholder="Enter item name"
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select
                      value={currentItem.category}
                      onChange={(e) => setCurrentItem({ ...currentItem, category: e.target.value })}
                      className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                    >
                      {CATEGORIES.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Unit</label>
                    <select
                      value={currentItem.unit}
                      onChange={(e) => setCurrentItem({ ...currentItem, unit: e.target.value })}
                      className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                    >
                      {UNITS.map(unit => (
                        <option key={unit} value={unit}>{unit}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                    <input
                      type="number"
                      step="0.1"
                      value={currentItem.quantity}
                      onChange={(e) => setCurrentItem({ ...currentItem, quantity: e.target.value })}
                      className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                      placeholder="Enter quantity"
                    />
                  </div>
                </div>

                <div className="flex gap-2 mt-6">
                  <button
                    onClick={() => setShowModal(false)}
                    className="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors font-medium"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleSave}
                    className="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-medium"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {showDeleteConfirm && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg shadow-xl w-full max-w-sm p-6">
                <h2 className="text-xl font-bold text-gray-800 mb-4">Confirm Delete</h2>
                <p className="text-gray-600 mb-6">Are you sure you want to delete the selected items?</p>
                
                <div className="flex gap-2">
                  <button
                    onClick={() => setShowDeleteConfirm(false)}
                    className="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors font-medium"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmDelete}
                    className="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- PWA Installation Script -->
  <script>
    let deferredPrompt;
    const installPrompt = document.getElementById('installPrompt');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');

    // Listen for install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installPrompt.classList.add('show');
    });

    // Install button click
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response: ${outcome}`);
        deferredPrompt = null;
        installPrompt.classList.remove('show');
      }
    });

    // Dismiss button click
    dismissBtn.addEventListener('click', () => {
      installPrompt.classList.remove('show');
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
