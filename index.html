<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Home Grocery - Modern grocery list app with WhatsApp sharing">
  <meta name="theme-color" content="#9333ea">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home Grocery">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <title>Home Grocery</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!--script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/4.1.13/lib.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script-->
  
  <!-- React and ReactDOM -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Install prompt styling */
    .install-prompt {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 12px;
      animation: slideUp 0.3s ease-out;
    }

    .install-prompt.show {
      display: flex;
    }

    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    .install-prompt button {
      background: white;
      color: #667eea;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .install-prompt button:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Install Prompt -->
  <div id="installPrompt" class="install-prompt">
    <span>📱 Install Home Grocery on your device!</span>
    <button id="installBtn">Install</button>
    <button id="dismissBtn" style="background: transparent; color: white; border: 1px solid white;">✕</button>
  </div>

  <script type="text/babel">
    const { useState } = React;

    // Lucide Icons as inline SVG components
    const Search = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    );

    const Plus = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );

    const Edit2 = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
      </svg>
    );

    const Trash2 = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );

    const Send = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    );

    const X = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );

    const UNITS = ['Item', 'Kg', 'Gram', 'Carton'];

    // Test data
    const initialItems = [
      { id: 1, name: 'Milk', unit: 'Kg', quantity: 2, checked: false },
      { id: 2, name: 'Bread', unit: 'Item', quantity: 3, checked: false },
      { id: 3, name: 'Tomatoes', unit: 'Gram', quantity: 500, checked: false },
      { id: 4, name: 'Eggs', unit: 'Carton', quantity: 1, checked: false },
      { id: 5, name: 'Rice', unit: 'Kg', quantity: 5, checked: false },
      { id: 6, name: 'Chicken', unit: 'Kg', quantity: 1.5, checked: false },
      { id: 7, name: 'Yogurt', unit: 'Item', quantity: 4, checked: false },
      { id: 8, name: 'Apples', unit: 'Kg', quantity: 2, checked: false },
    ];

    function App() {
      const [items, setItems] = useState(initialItems);
      const [searchQuery, setSearchQuery] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [modalMode, setModalMode] = useState('add');
      const [currentItem, setCurrentItem] = useState({ id: null, name: '', unit: 'Item', quantity: '' });
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

      const filteredItems = items.filter(item =>
        item.name.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const handleCheckbox = (id) => {
        setItems(items.map(item =>
          item.id === id ? { ...item, checked: !item.checked } : item
        ));
      };

      const handleAdd = () => {
        setModalMode('add');
        setCurrentItem({ id: null, name: '', unit: 'Item', quantity: '' });
        setShowModal(true);
      };

      const handleEdit = () => {
        const checkedItems = items.filter(item => item.checked);
        if (checkedItems.length === 0) {
          alert('Please select an item to edit');
          return;
        }
        if (checkedItems.length > 1) {
          alert('Please select only one item to edit');
          return;
        }
        setModalMode('edit');
        setCurrentItem(checkedItems[0]);
        setShowModal(true);
      };

      const handleDelete = () => {
        const checkedItems = items.filter(item => item.checked);
        if (checkedItems.length === 0) {
          alert('Please select items to delete');
          return;
        }
        setShowDeleteConfirm(true);
      };

      const confirmDelete = () => {
        setItems(items.filter(item => !item.checked));
        setShowDeleteConfirm(false);
      };

      const handleSave = () => {
        if (!currentItem.name.trim() || !currentItem.quantity) {
          alert('Please fill in all fields');
          return;
        }

        if (modalMode === 'add') {
          const newItem = {
            ...currentItem,
            id: Math.max(...items.map(i => i.id), 0) + 1,
            checked: false
          };
          setItems([...items, newItem]);
        } else {
          setItems(items.map(item =>
            item.id === currentItem.id ? currentItem : item
          ));
        }
        setShowModal(false);
      };

      const handleSend = () => {
        const checkedItems = items.filter(item => item.checked);
        if (checkedItems.length === 0) {
          alert('Please select items to send');
          return;
        }

        const message = checkedItems
          .map(item => `${item.name} ${item.quantity} ${item.unit}`)
          .join(', ');
        
        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
      };

      return (
        <div className="flex flex-col h-screen bg-gradient-to-br from-purple-50 to-blue-50">
          <div className="bg-gradient-to-r from-purple-600 to-blue-600 text-white p-4 shadow-lg">
            <h1 className="text-2xl font-bold text-center">Home Grocery</h1>
          </div>

          <div className="p-4 bg-white shadow-md">
            <div className="relative">
              <div className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                <Search size={20} />
              </div>
              <input
                type="text"
                placeholder="Search items..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-10 pr-4 py-3 border-2 border-purple-200 rounded-lg focus:outline-none focus:border-purple-500 transition-colors"
              />
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-2">
            {filteredItems.map(item => (
              <div
                key={item.id}
                className="bg-white rounded-lg shadow-md p-4 flex items-center gap-3 hover:shadow-lg transition-shadow"
              >
                <input
                  type="checkbox"
                  checked={item.checked}
                  onChange={() => handleCheckbox(item.id)}
                  className="w-5 h-5 text-purple-600 rounded focus:ring-2 focus:ring-purple-500"
                />
                <div className="flex-1 font-medium text-gray-800">{item.name}</div>
                <div className="text-sm text-gray-600 bg-purple-100 px-3 py-1 rounded-full">
                  {item.unit}
                </div>
                <div className="text-sm font-semibold text-gray-800 bg-blue-100 px-3 py-1 rounded-full">
                  {item.quantity}
                </div>
              </div>
            ))}
          </div>

          <div className="bg-white shadow-lg p-4 grid grid-cols-4 gap-2">
            <button
              onClick={handleAdd}
              className="flex flex-col items-center gap-1 p-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors"
            >
              <Plus size={24} />
              <span className="text-xs font-semibold">Add</span>
            </button>
            <button
              onClick={handleEdit}
              className="flex flex-col items-center gap-1 p-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
            >
              <Edit2 size={24} />
              <span className="text-xs font-semibold">Edit</span>
            </button>
            <button
              onClick={handleDelete}
              className="flex flex-col items-center gap-1 p-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
            >
              <Trash2 size={24} />
              <span className="text-xs font-semibold">Del</span>
            </button>
            <button
              onClick={handleSend}
              className="flex flex-col items-center gap-1 p-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors"
            >
              <Send size={24} />
              <span className="text-xs font-semibold">Send</span>
            </button>
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-xl font-bold text-gray-800">
                    {modalMode === 'add' ? 'Add Item' : 'Edit Item'}
                  </h2>
                  <button onClick={() => setShowModal(false)} className="text-gray-500 hover:text-gray-700">
                    <X size={24} />
                  </button>
                </div>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Item Name</label>
                    <input
                      type="text"
                      value={currentItem.name}
                      onChange={(e) => setCurrentItem({ ...currentItem, name: e.target.value })}
                      className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                      placeholder="Enter item name"
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Unit</label>
                    <select
                      value={currentItem.unit}
                      onChange={(e) => setCurrentItem({ ...currentItem, unit: e.target.value })}
                      className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                    >
                      {UNITS.map(unit => (
                        <option key={unit} value={unit}>{unit}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                    <input
                      type="number"
                      step="0.1"
                      value={currentItem.quantity}
                      onChange={(e) => setCurrentItem({ ...currentItem, quantity: e.target.value })}
                      className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                      placeholder="Enter quantity"
                    />
                  </div>
                </div>

                <div className="flex gap-2 mt-6">
                  <button
                    onClick={() => setShowModal(false)}
                    className="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors font-medium"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleSave}
                    className="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-medium"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {showDeleteConfirm && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg shadow-xl w-full max-w-sm p-6">
                <h2 className="text-xl font-bold text-gray-800 mb-4">Confirm Delete</h2>
                <p className="text-gray-600 mb-6">Are you sure you want to delete the selected items?</p>
                
                <div className="flex gap-2">
                  <button
                    onClick={() => setShowDeleteConfirm(false)}
                    className="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors font-medium"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmDelete}
                    className="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- PWA Installation Script -->
  <script>
    let deferredPrompt;
    const installPrompt = document.getElementById('installPrompt');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');

    // Listen for install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installPrompt.classList.add('show');
    });

    // Install button click
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response: ${outcome}`);
        deferredPrompt = null;
        installPrompt.classList.remove('show');
      }
    });

    // Dismiss button click
    dismissBtn.addEventListener('click', () => {
      installPrompt.classList.remove('show');
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>

</body>
</html>
